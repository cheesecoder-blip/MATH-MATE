<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile - Math Mate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=27" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="page">
  <input type="checkbox" id="theme" class="theme-toggle" />

  <!-- Shared Sidebar Container -->
  <div id="sidebar-container"></div>

  <main class="main-content">
    
    <!-- USER PROFILE CARD -->
    <div class="welcome-card" style="margin-bottom: 24px; position: relative;">
      <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
        <!-- AVATAR WITH CLICK TO EDIT -->
        <div style="position: relative; cursor: pointer;" onclick="openAvatarModal()" title="Click to edit profile picture / avatar color">
          <div id="profileAvatarLarge" class="avatar-placeholder" style="width: 80px; height: 80px; font-size: 1.8rem; font-weight: 800;">
            MM
          </div>
          <div style="position: absolute; bottom: 0; right: 0; background: var(--accent); color: #fff; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; border: 2px solid var(--surface);">
            <i class="icon" data-lucide="camera" style="width:14px; height:14px;"></i>
          </div>
        </div>

        <!-- PROFILE DETAILS -->
        <div style="flex: 1;">
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap:wrap;">
            <h1 id="profileNameDisplay" style="margin: 0; font-size: 1.6rem; color: var(--text);">Math Explorer</h1>
            <button class="btn btn-secondary btn-sm" onclick="openEditNameModal()">
              <i class="icon" data-lucide="edit-3"></i> Edit Name
            </button>
            <button class="btn btn-secondary btn-sm" onclick="openEditBioModal()">
              <i class="icon" data-lucide="message-square"></i> Edit Status
            </button>
          </div>
          <p id="profileBioDisplay" style="margin: 0; color: var(--soft); font-size: 0.95rem; line-height:1.4;">Mathematics Learner</p>
        </div>
      </div>
    </div>

    <!-- STATS SUMMARY -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px;">
      <div class="stat-card" style="flex-direction: column; align-items: flex-start;">
        <span style="font-size: 0.8rem; color: var(--soft); font-weight: 600;">Total EXP</span>
        <h2 id="profileXpDisplay" style="margin: 4px 0 0 0; font-size: 1.5rem; color: var(--accent);">0 EXP</h2>
      </div>

      <div class="stat-card" style="flex-direction: column; align-items: flex-start;">
        <span style="font-size: 0.8rem; color: var(--soft); font-weight: 600;">Global Leaderboard Rank</span>
        <h2 id="profileRankDisplay" style="margin: 4px 0 0 0; font-size: 1.5rem; color: #f59e0b;">#1</h2>
      </div>

      <div class="stat-card" style="flex-direction: column; align-items: flex-start;">
        <span style="font-size: 0.8rem; color: var(--soft); font-weight: 600;">Competencies Mastered</span>
        <h2 id="profileCompetenciesDisplay" style="margin: 4px 0 0 0; font-size: 1.5rem; color: #10b981;">0 / 27</h2>
      </div>
    </div>

    <!-- ENROLLED COURSES SECTION -->
    <div class="stat-card" style="flex-direction: column; align-items: stretch; margin-bottom: 24px;">
      <div class="flex-between" style="margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">
        <h3 style="margin: 0; font-size: 1.1rem; color: var(--text);">Enrolled Course Progress</h3>
        <span id="profileCoursesCount" style="font-size: 0.85rem; font-weight: 700; color: var(--accent);">Mathematics 7</span>
      </div>

      <div id="profileCoursesList">
        <div style="padding:12px; background:var(--chip); border-radius:12px; border:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-weight:700; color:var(--text); font-size:0.95rem;">Grade 7 General Mathematics</div>
            <div style="font-size:0.8rem; color:var(--soft);">Gusa Regional Science High School</div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="switchSection('courses')">View Curriculum</button>
        </div>
      </div>
    </div>

  </main>

  <script src="script.js?v=27"></script>

  <!-- Standard Reusable Modal Popup -->
  <div id="standardPopup" class="popup-overlay">
    <div class="popup-card">
      <span class="close-btn" onclick="closeStandardPopup()">✕</span>
      <h2 id="standardPopupTitle">Notification</h2>
      <div id="standardPopupContent" class="popup-body"></div>
    </div>
  </div>

</body>
</html>
