<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Mate - Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=27" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--page, #0f172a);
      color: var(--text, #f8fafc);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .login-card {
      background: var(--surface, #1e293b);
      border: 1px solid var(--border, #334155);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .login-logo {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--accent, #3b82f6);
      margin-bottom: 8px;
    }
    .login-subtitle {
      color: var(--soft, #94a3b8);
      font-size: 0.9rem;
      margin-bottom: 28px;
      line-height: 1.4;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--soft, #94a3b8);
      margin-bottom: 8px;
    }
    .login-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border, #334155);
      background: var(--chip, #0f172a);
      color: var(--text, #ffffff);
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
    }
    .login-input:focus {
      border-color: var(--accent, #3b82f6);
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent, #3b82f6);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    .login-btn:hover {
      opacity: 0.9;
    }
    .error-box {
      margin-top: 16px;
      padding: 12px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #f87171;
      border-radius: 10px;
      font-size: 0.85rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-logo">Math Mate</div>
    <p class="login-subtitle">Enter your linked Identification User ID and Display Name to access your account dashboard.</p>

    <form onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label for="loginIdentification">Identification (User ID)</label>
        <input 
          type="text" 
          id="loginIdentification" 
          class="login-input" 
          placeholder="e.g. Pulchrify or student_001" 
          required 
          autocomplete="off"
          minlength="3"
        />
      </div>

      <div class="form-group">
        <label for="loginFullName">Display Name (Full Name)</label>
        <input 
          type="text" 
          id="loginFullName" 
          class="login-input" 
          placeholder="e.g. Pulchrify or Juan Dela Cruz" 
          required
          autocomplete="off"
        />
      </div>

      <button type="submit" id="loginBtn" class="login-btn">Log In & Continue</button>

      <div id="loginError" class="error-box"></div>
    </form>
  </div>

  <script src="script.js?v=27"></script>
  <script>
    async function handleLoginSubmit(e) {
      if (e && typeof e.preventDefault === 'function') e.preventDefault();
      const idInput = document.getElementById('loginIdentification');
      const nameInput = document.getElementById('loginFullName');
      const errBox = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');
      
      const identification = idInput.value.trim();
      const fullName = nameInput.value.trim().replace(/^@+/, '');

      if (!identification || identification.length < 3) {
        errBox.innerText = 'Please enter a valid Identification User ID (at least 3 characters).';
        errBox.style.display = 'block';
        return;
      }

      if (!fullName) {
        errBox.innerText = 'Please enter your Full Name linked to this account.';
        errBox.style.display = 'block';
        return;
      }

      errBox.style.display = 'none';
      btn.innerText = 'Verifying Credentials...';
      btn.disabled = true;

      const result = await loginUser(identification, fullName);

      if (result.success) {
        window.location.href = 'index.html';
      } else {
        errBox.innerText = result.message || 'Login failed. Please check your credentials.';
        errBox.style.display = 'block';
        btn.innerText = 'Log In & Continue';
        btn.disabled = false;
      }
    }
  </script>

  <!-- Standard Reusable Modal Popup -->
  <div id="standardPopup" class="popup-overlay">
    <div class="popup-card">
      <span class="close-btn" onclick="closeStandardPopup()">✕</span>
      <h2 id="standardPopupTitle">Notification</h2>
      <div id="standardPopupContent" class="popup-body"></div>
    </div>
  </div>

</body>
</html>
