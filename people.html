<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>People & Messaging - Math Mate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=27" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="page">
  <input type="checkbox" id="theme" class="theme-toggle" />

  <!-- Shared Sidebar Container -->
  <div id="sidebar-container"></div>

  <main class="main-content">
    <div class="welcome-card flex-between" style="margin-bottom: 20px;">
      <div>
        <h1 style="margin:0; font-size:1.5rem; color:var(--text);">People & Messaging Directory</h1>
        <p style="margin:4px 0 0 0; color:var(--soft); font-size:0.9rem;">Connect with students, participate in group study squads, and send real-time direct messages.</p>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openCreateGroupModal()">
        <i class="icon" data-lucide="plus-circle"></i>
        <span>Create Group Squad</span>
      </button>
    </div>

    <!-- MAIN CHAT & DIRECTORY GRID -->
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:20px; align-items:start;">
      
      <!-- LEFT PANEL: USER SEARCH & CONVERSATION LIST -->
      <div class="stat-card" style="padding:16px; flex-direction:column;">
        <!-- USER SEARCH -->
        <div style="margin-bottom:16px;">
          <input type="text" id="peopleSearchInput" oninput="handlePeopleSearch(this.value)" placeholder="Search registered students..." style="width:100%; padding:10px 14px; border-radius:10px; border:1px solid var(--border); background:var(--chip); color:var(--text); font-size:0.88rem;" />
        </div>

        <div id="searchResultsSection" style="display:none; margin-bottom:16px; border-bottom:1px solid var(--border); padding-bottom:12px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span style="font-size:0.78rem; font-weight:700; color:var(--soft); text-transform:uppercase;">Search Results</span>
            <span id="searchResultCount" style="font-size:0.75rem; color:var(--muted);">0 found</span>
          </div>
          <div id="searchResultsList" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>

        <!-- CONVERSATIONS LIST -->
        <div id="conversationsList" style="display:flex; flex-direction:column;">
          <!-- Loaded dynamically by script.js?v=27 -->
        </div>
      </div>

      <!-- RIGHT PANEL: ACTIVE CHAT FEED -->
      <div class="stat-card" style="display:flex; flex-direction:column; height:580px; padding:0; overflow:hidden;">
        <!-- CHAT HEADER -->
        <div id="chatHeader" style="padding:16px 20px; border-bottom:1px solid var(--border); background:var(--chip); display:flex; align-items:center; justify-space-between;">
          <div>
            <h3 id="chatTitle" style="margin:0; font-size:1.05rem; color:var(--text);">Select a conversation</h3>
            <p id="chatSubtitle" style="margin:2px 0 0 0; font-size:0.78rem; color:var(--soft);">Direct and group messages sync live in Supabase.</p>
          </div>
        </div>

        <!-- MESSAGE FEED -->
        <div id="messageFeed" style="flex:1; padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; background:var(--surface);">
          <div style="margin:auto; text-align:center; color:var(--soft);">
            <i class="icon" data-lucide="message-square" style="width:42px; height:42px; margin-bottom:8px; opacity:0.4;"></i>
            <p style="margin:0; font-size:0.9rem;">Select a student or group on the left to start messaging.</p>
          </div>
        </div>

        <!-- INPUT BAR -->
        <form onsubmit="sendChatMessage(event)" style="padding:12px 16px; border-top:1px solid var(--border); background:var(--chip); display:flex; gap:10px; align-items:center;">
          <input type="text" id="chatMessageInput" placeholder="Type a message..." style="flex:1; padding:12px 16px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:0.9rem;" />

          <button type="submit" class="btn btn-primary" style="padding:12px 20px;">
            <i class="icon" data-lucide="send"></i>
          </button>
        </form>
      </div>

    </div>
  </main>

  <script src="script.js?v=27"></script>

  <!-- Standard Reusable Modal Popup -->
  <div id="standardPopup" class="popup-overlay">
    <div class="popup-card">
      <span class="close-btn" onclick="closeStandardPopup()">✕</span>
      <h2 id="standardPopupTitle">Notification</h2>
      <div id="standardPopupContent" class="popup-body"></div>
    </div>
  </div>

</body>
</html>
